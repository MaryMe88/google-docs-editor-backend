name: Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Каждый понедельник в 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Минимальные права: только чтение содержимого репозитория.
permissions:
  contents: read

jobs:
  pip-audit:
    name: Audit Python dependencies (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pip-audit on requirements.txt
        # Итерация 9: первый запуск информационный. Шаг помечается
        # warning, если pip-audit находит уязвимости, но не блокирует
        # job/workflow. Отдельным PR будет решено, включать ли
        # блокировку (continue-on-error: false).
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt --progress-spinner off

      - name: Run pip-audit on requirements-dev.txt
        continue-on-error: true
        run: |
          pip-audit -r requirements-dev.txt --progress-spinner off
