# pyproject.toml
#
# Единый конфиг инструментов качества: Ruff, mypy, pytest.
# Создан в рамках итерации 2 дорожной карты (quality gates).
# На данном этапе содержит только настройки линтера и форматтера;
# mypy/pytest-секции добавляются позже отдельными PR.

# ---------------------------------------------------------------------------
# Ruff: линтер + форматтер
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
# Какие файлы исключить из проверки полностью
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# Набор правил: E/W — pycodestyle, F — pyflakes, I — isort,
# UP — pyupgrade, B — bugbear, SIM — simplify, RUF — ruff-specific,
# PIE — flake8-pie.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PIE", "FBT001"]

# Что осознанно отключено:
#   E501     — длина строки контролируется форматтером, не линтером.
#   SIM102   — вложенные if часто читаемее одного длинного условия.
#   SIM108   — тернарник в retrieval хуже ветвления по читаемости.
#   SIM117   — nested with в тестах нагляднее одного длинного.
#   RUF001   — проект русскоязычный; кириллица в строках — намеренно.
#   RUF002   — кириллица в docstring — намеренно.
#   RUF003   — кириллица в комментариях — намеренно.
#   TRY004   — смена ValueError→TypeError требует ревизии тестов.
#   B904     — raise ... from err — косметика, отложено.
#   B905     — zip strict= — косметика, отложено.
#   RUF012   — mutable default в тестовых BASE_PAYLOAD — не баг.
#   E402     — импорты после reload в conftest/test_kb_loading — намеренно.
#
# Не указаны в ignore — эти правила уже активны в ruff 0.8.4:
#   UP042  — StrEnum vs (str, Enum)
#   UP045  — Optional[X] → X | None
#   RUF043 — pytest.raises(match=...) без raw-строки
# Если начнут срабатывать, добавлять их в ignore осознанно с обоснованием.
ignore = [
    "E501",
    "SIM102",
    "SIM108",
    "SIM117",
    "RUF001",
    "RUF002",
    "RUF003",
    "TRY004",
    "B904",
    "B905",
    "RUF012",
    "E402",
]

# BLE001 (blind except) пока не отключён глобально — подавляется
# точечными `# noqa: BLE001` там, где перехват осознанно широкий
# (диагностические проверки в startup_checks и т.п.).

[tool.ruff.lint.per-file-ignores]
# Миграция typing.Dict → dict отложена: в этих модулях нет
# `from __future__ import annotations`, автоматическая замена небезопасна
# для runtime-аннотаций Pydantic.
"src/config_types.py"     = ["UP006", "UP035"]
"src/contracts.py"        = ["UP006", "UP035"]
"src/knowledge_retrieval.py" = ["UP006", "UP035", "RUF100"]
"src/llm_client.py"       = ["UP006", "UP035", "RUF100"]
"src/main.py"             = ["UP006", "UP035"]
"src/output_guard.py"     = ["UP035"]
"src/startup_checks.py"   = ["UP006", "UP035", "RUF100"]
"src/kb_manifest_loader.py" = ["UP035"]
"src/prompt_builder/builder.py"     = ["UP006", "UP035", "RUF100"]
"src/prompt_builder/kb_rendering.py" = ["UP006", "UP035", "RUF100"]
"src/prompt_builder/kb_loading.py"   = ["UP006", "UP035", "RUF100"]
"src/prompt_builder/feature_resolution.py" = ["UP006", "UP035", "RUF100"]
"src/prompt_builder/config_loaders.py"     = ["UP035", "RUF100"]
"src/prompt_builder/normalization.py"      = ["UP035"]
"src/reason_codes.py"     = ["UP035"]
"src/registry.py"         = ["UP006", "UP035"]
"src/scoring_weights.py"  = ["UP035"]
"src/shared_contracts.py" = ["UP035"]
"src/tag_registry.py"     = ["UP006", "UP035"]
"scripts/audit_tags.py"   = ["UP035"]
"scripts/fix_tag_map.py"  = ["UP035"]
"tests/conftest.py"       = ["UP035"]
"tests/test_client_sync.py" = ["UP035"]
"tests/test_contracts.py"   = ["UP035"]
"tests/test_edit_guard.py"  = ["UP035"]
"tests/test_golden_retrieval.py" = ["UP035"]
"tests/test_knowledge_retrieval.py" = ["UP035"]
"tests/test_knowledge_retrieval_fallback.py" = ["UP035"]
"tests/test_prompt_builder_architecture.py"  = ["UP035"]

# RUF100 отключён в файлах с `# noqa: C901/PLR1702` (итерация 9.2, issue #93):
# C901/PLR1702 не входят в общий select, поэтому Ruff считает эти noqa "unused".
# Вернуть после рефакторинга (карта №3 удалит noqa вместе с упрощением функций).
"src/config_models/tag_constants.py"     = ["RUF100"]
"src/config_models/tags.py"              = ["RUF100"]
"src/context_budget.py"                  = ["RUF100"]

# FBT001 отключён в тестах и скриптах (итерация 10.3 карты №2):
# gate FBT001 действует только на src (публичный API). Тесты и
# утилитарные скрипты не публичный API.
"tests/**"   = ["FBT001"]
"scripts/**" = ["FBT001"]

# ---------------------------------------------------------------------------
# Пороги сложности (итерация 9.2 карты №2, issue #93)
# ---------------------------------------------------------------------------
# C901 (mccabe) — цикломатическая сложность ≤ 10.
# PLR1702 (pylint, preview) — вложенность ≤ 4.
# Активируются только в отдельной CI-команде
# (ruff check src --select C901,PLR1702 --preview);
# в общий select не входят, чтобы не расширять scope на scripts/tests.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-nested-blocks = 4

# ---------------------------------------------------------------------------
# Ruff formatter — настройки совпадают с линтером
# ---------------------------------------------------------------------------
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# mypy — статическая проверка типов (итерация 4, foundation)
# ---------------------------------------------------------------------------
# Пока проверяется только узкий набор стабильных модулей; список
# расширяется отдельными PR. Запуск: mypy <files> (или из CI).
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

# ---------------------------------------------------------------------------
# pytest — конфигурация перенесена из pytest.ini в итерации 10
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

# ---------------------------------------------------------------------------
# coverage — порог минимального покрытия (итерация 9)
# ---------------------------------------------------------------------------
# Значение рассчитано по CI main на SHA c67fcee (PR #91):
#   TOTAL: 4257 stmts, 602 miss, 86% (точно 85.86%)
#   floor(85.86) - 1 = 84
# Правило: карта №2, итерация 9.
[tool.coverage.report]
fail_under = 84
