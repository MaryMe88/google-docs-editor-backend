[pytest]
minversion = 6.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
