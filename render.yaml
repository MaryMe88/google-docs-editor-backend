services:
  - type: web
    name: google-docs-editor-backend
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python scripts/validate_kb_tags.py
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
