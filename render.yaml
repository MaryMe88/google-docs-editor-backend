services:
  - type: web
    name: google-docs-editor-backend
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /livez
    envVars:
      - key: PYTHONPATH
        value: .
      - key: API_SECRET_KEY
        sync: false
      - key: OPENROUTER_SITE_URL
        value: https://google-docs-editor-backend.onrender.com